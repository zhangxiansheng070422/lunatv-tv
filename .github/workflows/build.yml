name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建 APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - name: 重命名
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/lunakiosk.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: lunakiosk
          path: out/lunakiosk.apk
          retention-days: 7

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          gh release delete latest -R "$R" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/lunakiosk.apk -R "$R" \
            --title "LunaTV TV client" \
            --notes "commit $GITHUB_SHA"
